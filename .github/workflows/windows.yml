name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  test:
    name: Tests (Core, WPF, end to end)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the sync server
        uses: actions/checkout@v4
        with:
          repository: satyanvm/reader-android
          path: reader-android
      - name: Test
        shell: pwsh
        env:
          READER_E2E_SERVER: http://127.0.0.1:8787
        run: |
          scripts/start-sync-server.ps1
          dotnet test -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - name: Upload test results and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
            ${{ runner.temp }}/reader-wpf-tests/*.png
            ${{ runner.temp }}/reader-sync-server.log*
          if-no-files-found: warn

  selftest:
    name: Self-test (real app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the sync server
        uses: actions/checkout@v4
        with:
          repository: satyanvm/reader-android
          path: reader-android
      - name: Build
        run: dotnet build src/Reader.App -c Release
      - name: Make sample books
        shell: pwsh
        env:
          READER_SAMPLE_OUT: ${{ github.workspace }}\samples
        run: dotnet test tests/Reader.Core.Tests -c Release --filter "FullyQualifiedName~SampleBooks"
      - name: Self-test with an EPUB (signed in to the local server) and a PDF
        shell: pwsh
        run: |
          scripts/start-sync-server.ps1
          $failed = 0
          scripts/selftest.ps1 -Book samples/sample.epub -Name epub -Server http://127.0.0.1:8787; if ($LASTEXITCODE) { $failed++ }
          scripts/selftest.ps1 -Book samples/sample.pdf -Name pdf; if ($LASTEXITCODE) { $failed++ }
          exit $failed
      - name: Upload self-test logs and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest-out/*/selftest.jsonl
            selftest-out/*/png/*.png
            selftest-out/*/library/logs/*
            ${{ runner.temp }}/reader-sync-server.log*
          if-no-files-found: warn

  publish:
    name: Reader.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: scripts/build.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: Reader-win-x64
          path: publish/win-x64/Reader.exe
          retention-days: 7
